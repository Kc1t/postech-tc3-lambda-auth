name: CI/CD

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]

permissions:
  contents: read

env:
  TF_VERSION: 1.9.8

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - run: gofmt -l ./cmd ./internal | tee /tmp/fmt && test ! -s /tmp/fmt

      - run: go vet ./...

      - run: go test ./... -race -cover

  plan:
    name: Terraform Plan
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -backend=false

      - run: terraform validate

  deploy:
    name: Deploy
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Empacotar a function
        run: make package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Resolver ambiente
        run: echo "TF_ENV=${{ github.ref_name == 'main' && 'prod' || 'staging' }}" >> $GITHUB_ENV

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=lambda-auth/${TF_ENV}.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_database_url: ${{ secrets.POSTGRES_DSN }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
        run: terraform apply -auto-approve -var-file=envs/${TF_ENV}.tfvars

      - name: Publicar os invoke ARNs
        working-directory: infra
        run: |
          {
            echo "### Ligar no postech-tc3-infra-k8s"
            echo '```hcl'
            echo "lambda_issuer_invoke_arn     = \"$(terraform output -raw issuer_invoke_arn)\""
            echo "lambda_authorizer_invoke_arn = \"$(terraform output -raw authorizer_invoke_arn)\""
            echo "lambda_issuer_function_name     = \"$(terraform output -raw issuer_function_name)\""
            echo "lambda_authorizer_function_name = \"$(terraform output -raw authorizer_function_name)\""
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
